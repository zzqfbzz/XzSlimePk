# ============================================================
#  XzPk V3 配置文件 —— sliding 大范围示例(等价于新版 skimepk2 的默认参数)
#  使用: java -cp out xzpk.Main config.sliding.properties
# ============================================================

mode=sliding

# 计算范围(区块坐标, 含端点)
minChunkX=-5000
maxChunkX=5000
minChunkZ=-5000
maxChunkZ=5000

seed=2950649267509295309

# 滑动窗口 12x12
windowSize=12

skip=1
bandCols=4096

topK=50
outFile=

originX=0
originZ=0
threads=0
showProgress=true
