# ============================================================
#  XzPk V3 配置文件(UTF-8 编码, 修改后保存即可)
#  运行: 双击 run.bat  或  java -cp out xzpk.Main config.properties
#  说明: 所有键都可省略, 省略时使用内置默认值(见下方括号注释)
# ============================================================

# ---- 计算模式 ----
# grid    : 从范围左上角按 windowSize 铺互不重叠的格子(锚点=角点+k*windowSize)
# sliding : 窗口起点为范围内每个区块(或按 skip), 逐区块滑动, 找全局最优
# 两者都允许窗口向右/下溢出范围边缘: 只要求左上角锚点区块在范围内
mode=grid

# ---- 坐标输入单位 ----
# chunk : 范围/原点按区块坐标填(默认)
# block : 范围/原点按方块坐标填(游戏 F3 显示的坐标), 程序自动 ÷16 换算成区块
coordUnit=chunk

# ---- 扫描范围(坐标, 含端点; 窗口大小永远按"区块"数填) ----
# 注意: coordUnit=chunk 时下面填的是区块坐标; coordUnit=block 时填方块坐标
minChunkX=-60000
maxChunkX=60000
minChunkZ=-60000
maxChunkZ=60000

# 世界种子
seed=2950649267509295309

# 窗口边长(区块)。默认 8(grid/sliding 一致, 8=单个玩家加载的最大区域), 按需修改
windowSize=8

# ---- sliding 专用 ----
# 窗口起点步进, 1=全覆盖(默认1); 8/16 用于粗扫加速
skip=1
# X 方向每个分片最多覆盖的窗口起点列数(默认4096, 越大单线程内存略增)
bandCols=4096

# ---- 输出 ----
# 最多/最少各保留多少条(默认100, 逐条与当前列表比较决定插入, 不保存全部窗口)
topK=100
# 结果导出文件; 留空=仅控制台; 以 .csv 结尾导出 CSV, 否则导出 TXT
outFile=

# ---- 排序/性能 ----
# 数量并列时按"距原点近->远"排序, 这里填你的基地区块坐标
originX=0
originZ=0
# 线程数, 0 = 自动(CPU核数)
threads=0
# 是否显示进度条
showProgress=true
