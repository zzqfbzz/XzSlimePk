# ============================================================
#  XzPk V3 配置文件(UTF-8 编码, 修改后保存即可)
#  运行: 双击 run.bat  或  java -cp out xzpk.Main config.properties
#  说明: 所有键都可省略, 省略时使用内置默认值(见下方括号注释)
# ============================================================

# ---- 计算模式 ----
# grid    : 对齐网格 —— 范围按 windowSize 对齐成互不重叠的完整方块(旧版 slimepk 思路)
# sliding : 滑动窗口 —— 窗口起点逐区块(或按 skip)滑动, 可覆盖任意位置(新版 skimepk2 思路)
mode=grid

# ---- 扫描范围(区块坐标, 含端点; 16 区块 = 256 格) ----
minChunkX=-60000
maxChunkX=60000
minChunkZ=-60000
maxChunkZ=60000

# 世界种子
seed=2950649267509295309

# 窗口边长(区块)。grid=对齐块边长(默认8); sliding=滑动窗口边长(默认12)
windowSize=8

# ---- sliding 专用 ----
# 窗口起点步进, 1=全覆盖(默认1); 8/16 用于粗扫加速
skip=1
# X 方向每个分片最多覆盖的窗口起点列数(默认4096, 越大单线程内存略增)
bandCols=4096

# ---- 输出 ----
# 最多/最少各输出多少条
topK=50
# 结果导出文件; 留空=仅控制台; 以 .csv 结尾导出 CSV, 否则导出 TXT
outFile=

# ---- 排序/性能 ----
# 数量并列时按"距原点近->远"排序, 这里填你的基地区块坐标
originX=0
originZ=0
# 线程数, 0 = 自动(CPU核数)
threads=0
# 是否显示进度条
showProgress=true
